name: Wire responsive stylesheet

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire-stylesheet:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wire styles.css into index.html
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          link = '    <link rel="stylesheet" href="styles.css">\n'

          if 'href="styles.css"' not in text:
              marker = '    </style>\n</head>'
              if marker not in text:
                  raise SystemExit('Could not find the closing inline style/head marker')
              text = text.replace(marker, '    </style>\n' + link + '</head>', 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Ensure stylesheet wins on mobile
        run: |
          cat >> styles.css <<'EOF'

          /* Final mobile cascade: this file is loaded after the inline base CSS. */
          @media (max-width: 768px) {
            .nav-links { display: none !important; }
            .nav-links.active { display: flex !important; }
            .mobile-menu { display: flex !important; }
            .hero-content { flex-direction: column !important; align-items: stretch !important; width: 100% !important; }
            .hero-text { width: 100% !important; max-width: none !important; }
            .hero-text h1 { font-size: clamp(2rem, 9vw, 2.7rem) !important; line-height: 1.08 !important; }
            .about-content, .contact-content { grid-template-columns: 1fr !important; }
            .values-grid { grid-template-columns: 1fr !important; }
            .hero .flex .btn { width: 100% !important; flex: 1 1 100% !important; }
            .contact-form { width: 100% !important; box-sizing: border-box !important; }
            .form-group input, .form-group textarea { width: 100% !important; max-width: 100% !important; box-sizing: border-box !important; }
          }
          EOF

      - name: Commit completed fix
        run: |
          rm -f .github/workflows/wire-styles.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css .github/workflows/wire-styles.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: wire responsive mobile styles"
          git push